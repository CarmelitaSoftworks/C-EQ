name: Release

# Publica el release de la versión de app/build.gradle.kts cuando llegan a main sus notas
# (.github/releases/vX.Y.Z.md) o un APK nuevo en dist/: crea la etiqueta vX.Y.Z y sube el APK firmado
# de dist/ (la clave de firma no está en GitHub). También se puede lanzar a mano.
on:
  push:
    branches: [main]
    paths: [".github/releases/**", "dist/C-EQ.apk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar versión, notas y APK
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          notes=".github/releases/$tag.md"
          test -f "$notes" || { echo "Faltan las notas $notes"; exit 1; }
          sha=$(sha256sum dist/C-EQ.apk | cut -c1-64)
          grep -q "$sha" "$notes" || { echo "El SHA-256 de las notas no es el de dist/C-EQ.apk ($sha)"; exit 1; }
          cp dist/C-EQ.apk "C-EQ-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          # Título: la primera línea «# …» de las notas
          echo "TITLE=$(sed -n 's/^# //p' "$notes" | head -1)" >> "$GITHUB_ENV"
      # Si la etiqueta ya existe en otro commit (p. ej. tras reescribir el historial), se mueve a este
      - name: Etiqueta en este commit
        run: |
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          body_path: .github/releases/${{ env.TAG }}.md
          files: C-EQ-${{ env.VERSION }}.apk
          make_latest: true
